# Change these first
owner: UEM-Group-Websites # Your GitHub organization or username, where this repository lives
repo: uptime-checker # The name of this repository

sites:
  - name: UEM Main Website
    url: https://uem.edu.in/site-health-page/
  - name: IEM Main Website
    url: https://iem.edu.in/site-health-page/
    headers:
      # - "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36"
      - "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
      - "Accept-Language: en-US,en;q=0.9"
      - "User-Agent: upptime.js.org"
  - name: UEM Jaipur Website
    url: https://uem.edu.in/uem-jaipur/site-health-page/
  - name: UEM Kolkata Website
    url: https://uem.edu.in/uem-kolkata/site-health-page/
  - name: UEM Staging Main Website
    url: https://staging.uem.edu.in/site-health-page/
  - name: UEM Staging Jaipur Website
    url: https://staging.uem.edu.in/uem-jaipur/site-health-page/
  - name: UEM Staging Kolkata Website
    url: https://staging.uem.edu.in/uem-kolkata/site-health-page/

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.uem.edu.in
  # baseUrl: /your-repo-name
  # Theme, logo and fonts match uem.edu.in. The CSS and images live in /assets,
  # which Upptime copies into every build, so they survive automatic deploys.
  logoUrl: https://status.uem.edu.in/uem-logo.webp
  logoHref: /
  favicon: https://status.uem.edu.in/uem-favicon.webp
  faviconSvg: https://status.uem.edu.in/uem-favicon.webp
  themeUrl: https://status.uem.edu.in/uem-theme.css
  name: IEM-UEM Group Status
  introTitle: IEM-UEM Group Website Status
  introMessage: Live availability and response times for IEM-UEM Group websites. Each site is checked every five minutes. When a site goes down, an incident opens automatically and closes once the site recovers.
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap
  navbar:
    - title: Status
      href: /
    - title: uem.edu.in
      href: https://uem.edu.in
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
  # Keep the status page out of search engines (see also assets/robots.txt)
  metaTags:
    - name: robots
      content: noindex, nofollow, noarchive, nosnippet, noimageindex
    - name: googlebot
      content: noindex, nofollow, noarchive, nosnippet, noimageindex

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
